spring:
  application:
    name: file-service
  data:
    r2dbc:
      repositories:
        enabled: true
  threads:
    virtual:
      enabled: true
  web:
    error:
      include-message: always
      include-stacktrace: on-param

resilience4j.retry:
  instances:
    storageAzure:
      max-attempts: 3
      wait-duration: 10s
